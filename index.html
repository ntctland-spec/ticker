<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
background: transparent;
overflow: hidden;
}

.ticker {
position: relative;
width: 100%;
height: 100%;
overflow: hidden;
}

.ticker-text {
position: absolute;
white-space: nowrap;
top: 50%;
left: 100%;
transform: translateY(-50%);
font-family: "Meiryo", "Yu Gothic", sans-serif;
font-size: 48px;
font-weight: bold;
color: #ffffff;
-webkit-text-stroke: 2px #000;
text-shadow:
2px 2px 0 #000,
-2px 2px 0 #000,
2px -2px 0 #000,
-2px -2px 0 #000;
animation: ticker 18s linear infinite;
}

@keyframes ticker {
from {
transform: translate(0, -50%);
}
to {
transform: translate(calc(-100vw - 100%), -50%);
}
}
</style>
</head>

<body>

<div class="ticker">
<div class="ticker-text">

</div>

</body>
