<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
html,body{
margin:0;
overflow:hidden;
background:transparent;
}

.ticker{
width:100%;
overflow:hidden;
white-space:nowrap;
font-family:"Yu Gothic","Meiryo",sans-serif;
font-size:52px;
font-weight:900;
}

.ticker span{
display:inline-block;
padding-left:100%;
animation:
scroll 22s linear infinite,
glow 2.8s ease-in-out infinite;

background:linear-gradient(
90deg,
#8FDFFF 0%,
#DFF8FF 25%,
#FFFFFF 50%,
#DFF8FF 75%,
#8FDFFF 100%
);

background-size:200% auto;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

filter:drop-shadow(0 0 4px rgba(150,230,255,.7))
drop-shadow(0 0 10px rgba(180,240,255,.8))
drop-shadow(0 0 18px rgba(255,255,255,.6));
}

@keyframes scroll{
from{transform:translateX(0);}
to{transform:translateX(-100%);}
}

@keyframes glow{
0%{
filter:drop-shadow(0 0 4px rgba(150,230,255,.5))
drop-shadow(0 0 10px rgba(180,240,255,.5))
drop-shadow(0 0 18px rgba(255,255,255,.4));
}

50%{
filter:drop-shadow(0 0 10px rgba(170,240,255,1))
drop-shadow(0 0 20px rgba(220,250,255,1))
drop-shadow(0 0 35px rgba(255,255,255,1));
}

100%{
filter:drop-shadow(0 0 4px rgba(150,230,255,.5))
drop-shadow(0 0 10px rgba(180,240,255,.5))
drop-shadow(0 0 18px rgba(255,255,255,.4));
}
}
</style>
</head>

<body>

<div class="ticker">
<span>
🎉 本日21時03分〜　クイズ大会開催‼️　優勝者には『わっちゃまチェキ』プレゼント🎁　初見さんも大歓迎❤️‍🔥
</span>
</div>

</body>
</html>
