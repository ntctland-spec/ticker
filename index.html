  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .ticker {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .ticker-content {
      position: absolute;
      top: 50%;
      left: 100%;
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
      transform: translateY(-50%);
      animation: scroll-left 18s linear infinite;
      will-change: transform;
    }

    .ticker-text {
      font-family: "Meiryo", "Yu Gothic", sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      -webkit-text-stroke: 2px #000000;
      text-shadow:
        2px 2px 0 #000000,
        -2px 2px 0 #000000,
        2px -2px 0 #000000,
        -2px -2px 0 #000000;
    }

    .corgi {
      width: 82px;
      height: 82px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    @keyframes scroll-left {
      from {
        transform: translate(0, -50%);
      }
      to {
        transform: translate(calc(-100vw - 100%), -50%);
      }
    }
  </style>
