<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流れるテロップ</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .ticker {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .ticker-text {
      position: absolute;
      top: 50%;
      left: 100%;
      transform: translateY(-50%);
      white-space: nowrap;

      font-family: "Meiryo", "Yu Gothic", sans-serif;
      font-size: 48px;
      font-weight: bold;
      color: white;

      -webkit-text-stroke: 2px black;
      text-shadow:
        2px 2px 0 black,
        -2px 2px 0 black,
        2px -2px 0 black,
        -2px -2px 0 black;

      animation: scroll-left 16s linear infinite;
    }

    @keyframes scroll-left {
      from {
        transform: translate(0, -50%);
      }
      to {
        transform: translate(-150vw, -50%);
      }
    }
  </style>
</head>

<body>
  <div class="ticker">
    <div class="ticker-text">
      バイオハザード レクイエム配信中！プレイ済みの方は攻略のコツをコメントで教えてください！
    </div>
  </div>
</body>
</html>
